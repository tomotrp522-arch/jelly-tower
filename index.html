<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe2ed" />
    <meta
      name="description"
      content="指でそっと、ぷるんと重ねる。かわいいゼリーのバランスゲーム。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/jelly.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>ぷるぷるゼリータワー</title>
  </head>
  <body>
    <div class="app">
      <header class="page-heading">
        <span class="heading-star" aria-hidden="true">✦</span>
        <h1>ぷるぷる<span>ゼリータワー</span></h1>
        <span class="heading-star" aria-hidden="true">✦</span>
      </header>
      <main>
        <section class="game-shell" aria-label="ゼリーを積み上げるゲーム">
          <canvas
            id="game"
            aria-label="左右にドラッグして、指を離すとゼリーが落ちます。キーボードは左右キーとスペースキー。"
            tabindex="0"
          ></canvas>
          <div class="scorebar">
            <div class="score-cloud">
              <span class="label">スコア</span
              ><strong id="score">0<span>こ</span></strong
              ><span class="cloud-star" aria-hidden="true">★</span>
            </div>
            <div class="best">
              <span class="crown" aria-hidden="true">♛</span>
              <div>
                <span class="label">ベストスコア</span
                ><strong id="best">0<span>こ</span></strong>
              </div>
            </div>
          </div>
          <div class="game-tools">
            <button
              id="sound"
              class="icon-button"
              aria-label="音楽と効果音をオフにする"
              aria-pressed="true"
            >
              ♫</button
            ><button
              id="help"
              class="icon-button"
              aria-label="遊びかた"
              aria-expanded="false"
              aria-controls="instructions"
            >
              ?
            </button>
          </div>
          <div class="hint" id="hint">
            <span class="drag-arrow" aria-hidden="true">⟷</span
            ><span class="hint-cloud"
              >左右にドラッグして<br />はなすと落ちるよ！</span
            >
          </div>
          <div id="instructions" hidden>
            <h2>あそびかた</h2>
            <p>
              ゼリーを左右にドラッグして、指を離すと落下。お皿から落ちたらおしまい！
            </p>
            <p>PCでは左右キーで移動、スペースキーで落とせます。</p>
            <p>ホーム画面に追加するとオフラインでも遊べます。</p>
            <span>もう一度「?」を押すと閉じます</span>
          </div>
          <div class="overlay" id="gameover" hidden>
            <div class="result">
              <div class="result-crown" aria-hidden="true">♛</div>
              <span class="eyebrow">SWEET LITTLE TOWER</span>
              <h2>おつかれさま！</h2>
              <p>ぷるぷる、よくできました。</p>
              <strong id="result-score">0<span>こ</span></strong>
              <p id="record"></p>
              <button id="retry">
                もういちど遊ぶ <span aria-hidden="true">↻</span>
              </button>
            </div>
          </div>
          <div class="bottom-cloud">
            <span aria-hidden="true">★</span>どこまで高く積めるかな？<span
              aria-hidden="true"
              >★</span
            >
          </div>
        </section>
      </main>
      <footer>指でそっと、ぷるんと重ねて。<span>JELLY TOWER</span></footer>
    </div>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>
    <script type="module" src="/src.js"></script>
  </body>
</html>
